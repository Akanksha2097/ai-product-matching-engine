[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchwise-ai"
version = "0.1.0"
description = "Interpretable product matching and catalog entity resolution platform"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1", "fastapi>=0.115", "numpy>=1.26", "pandas>=2.2",
  "plotly>=5.24", "pydantic>=2.9", "pyarrow>=14", "python-multipart>=0.0.9",
  "rapidfuzz>=3.10", "scikit-learn>=1.5", "streamlit>=1.39",
  "uvicorn>=0.32"
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.2", "faiss-cpu>=1.9"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
